# S0 spatial redistribution — the project's original hypothesis (spec §8).
# Divert a share of peak trips onto alternative paths at unchanged departure
# times: spread traffic across roads rather than across time. Documentary
# evidence says this fails inside the Ring Road (all river crossings over
# capacity in 2012; the parallel bridges are the most oversaturated links at
# V/C 2.70-2.76; ~80% of corridor traffic is through-traffic) — this scenario
# tests that in our own model instead of citing it. Alternatives are abundant
# on this network; what they cost is capacity, which is what the run measures.
name = "s0-spatial-control"
# Transform seeds. The simulation itself is reproducible - the untouched
# baseline varies by 2.4% across SUMO seeds (7,039/6,761/6,744 veh-h) - so the
# spread across these is treatment-assignment variance: which trips comply.
# At three seeds that spread was as large as the effects (sd 11-15 points on
# mode shift, 89 on the 25% school shift) and the dose-responses came out
# non-monotone. Twenty-four seeds put the standard error near 3 points, and the
# spread is reported rather than hidden: the effect genuinely depends on which
# travellers comply.
seeds = [101, 108, 115, 122, 129, 136, 143, 150, 157, 164, 171, 178, 185, 192, 199, 206, 213, 220, 227, 234, 241, 248, 255, 262]
notes = "original hypothesis: spatial redistribution at unchanged departure times"

[transforms.reroute]
p_r = [0.05, 0.10, 0.20]
