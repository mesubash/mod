# S4 - corridor closure with coordinated rerouting. The project's primary
# module: non-recurring congestion (VIP movement, accident, flooded underpass)
# is the regime where rerouting is the only available lever, since a trip
# already underway cannot be retimed or mode-shifted.
#
# The closure is enforced in the network: the [closure] block below makes
# run.py write a SUMO rerouter (pipeline/disruption.py) that shuts the edge for
# the window, so un-guided vehicles meet the block and reroute reactively on
# arrival. That is today's behaviour, which makes p_r = 0 the uncoordinated
# control rather than an untouched run.
#
# k_alternatives is the point of the scenario: k=1 sends every diverted vehicle
# to the single best alternative, which is what a conventional navigation app
# does; k=3 splits them across three, so no one parallel road absorbs the whole
# diversion.
name = "s4-closure"
seeds = [101, 202, 303]
notes = "closure enforced in-network; p_r=0 is the uncoordinated control"

# Koteshwor leg 3 inbound: a 991 m two-lane trunk approach to the corridor's
# busiest junction. The earlier choice, 170533894, was a 0.2 m junction
# connector — closing it changed nothing, which is why the enforced and
# unenforced grids returned identical numbers.
[closure]
edges = ["670112945"]
begin = 32400   # 09:00, the measured AM peak hour (spec §4)
end = 36000     # 10:00

[transforms.spread_reroute]
closed_edges = ["670112945"]
p_r = [0.0, 0.1, 0.25, 0.5]
k_alternatives = [1, 3]
