# S4 - corridor closure with coordinated rerouting. The project's primary
# module: non-recurring congestion (VIP movement, accident, flooded underpass)
# is the regime where rerouting is the only available lever, since a trip
# already underway cannot be retimed or mode-shifted.
#
# The closure is enforced in the network: the [closure] block makes run.py
# write a SUMO rerouter (pipeline/disruption.py) that shuts the edge for the
# window, and closure runs give every vehicle a rerouting device so un-guided
# traffic meets the block and re-plans on arrival. That is today's behaviour.
#
# READ THE DELTAS AGAINST p_r = 0, NOT THE GLOBAL BASELINE. The rerouting
# device changes routing for every vehicle, so a closure run and the
# device-free baseline differ for reasons that have nothing to do with the
# closure. p_r = 0 is the uncoordinated control; the guided rows are measured
# against it.
#
# k_alternatives is the point of the scenario: k=1 sends every diverted vehicle
# to the single best alternative, which is what a conventional navigation app
# does; k=3 splits them across three.
name = "s4-closure"
seeds = [101, 102, 103]
notes = "closure enforced; compare guided rows against p_r=0, not the baseline"

# Maitighar leg 1 inbound: 370 m of primary road carrying 20,196 of the
# 182,288 routed trips. Verified against the demand before use - the previous
# two choices were a 0.2 m junction connector and a 991 m trunk link that no
# route touched, and both produced 24 identical runs.
[closure]
edges = ["171203196#0"]
begin = 25200   # 07:00 - see [analysis]
end = 28800     # 08:00

# The spec's 08:00-11:00 window cannot score this closure. In the baseline the
# closed edge runs at 0.03 m/s during 09:00-10:00 with 84 vehicles through it
# and 74.5% occupancy: it is already delivering nothing, so shutting it removes
# nothing. Network-wide, 31% of edges are below 1 m/s at 09:00 and 44% at
# 10:00. At 07:00 the corridor still moves (median 14.4 m/s, 0.2% of edges
# below 1 m/s) and that edge carries 1,689 vehicles, so a closure there
# disrupts traffic that was actually flowing. The window covers the closure
# hour and two hours of aftermath.
[analysis]
begin = 25200   # 07:00
end = 36000     # 10:00

[transforms.spread_reroute]
closed_edges = ["171203196#0"]
p_r = [0.0, 0.5]
k_alternatives = [1, 3]
# Scalar, so it stays out of the run id and the seed-101 runs already on disk
# are reused. kappa = 1 is the omniscient control: every un-guided driver
# reroutes on live travel times. s4-kappa relaxes it.
kappa = 1.0
